spring:
  application:
    name: backend

  datasource:
    # Keep database connection details outside the source code using environment variables.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${spring.application.name}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      repositories:
        enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}

solaris:
  monitoring:
    fixed-delay: ${MONITORING_FIXED_DELAY:60000}
