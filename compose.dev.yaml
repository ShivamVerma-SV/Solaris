# Development-only host bindings. Keep this file out of production Compose commands.
services:
  postgres:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  backend:
    environment:
      DEVELOPMENT: "true"
      SPRING_PROFILES_ACTIVE: development
